name: i³ Awards — whitelist a pilot test wallet

# Preps a round for PILOT TESTING (scripts/data/award-test-setup.ts):
#   1. whitelists one address on the round (idempotent — safe to re-run),
#   2. optionally flips the round to testMode (ballots carry the i3-test memo),
#   3. optionally friendbot-funds the address on testnet.
#
# The address is a PUBLIC Stellar key — fine to pass here and appear in the log.
# Idempotent and additive: never deletes or edits other voters/rounds.
#
# Run dry first (execute=false), read the log, then execute=true.

on:
  workflow_dispatch:
    inputs:
      address:
        description: "Stellar public key (G...) to whitelist."
        type: string
        required: true
      round:
        description: "Round slug. Leave blank for the open round."
        type: string
        required: false
      test_mode:
        description: "Set the round to testMode (i3-test memo on ballots)."
        type: boolean
        default: false
      fund:
        description: "Friendbot-fund the address on testnet (only with execute)."
        type: boolean
        default: false
      reset:
        description: "Delete this address's ballot for the round so it can vote again (test wallets)."
        type: boolean
        default: false
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false

permissions: { contents: read }

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      AWARDS_RELAY_SECRET: ${{ secrets.AWARDS_RELAY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Inputs reach the shell through the environment, never by interpolation
      # into the command: this job holds secrets, and an input pasted into
      # `run:` is a command injection for anyone who can dispatch it.
      - name: Test setup (dry-run unless execute=true)
        env:
          IN_ADDRESS: ${{ inputs.address }}
          IN_ROUND: ${{ inputs.round }}
          IN_TEST_MODE: ${{ inputs.test_mode }}
          IN_FUND: ${{ inputs.fund }}
          IN_RESET: ${{ inputs.reset }}
          IN_EXECUTE: ${{ inputs.execute }}
        run: |
          args=(--address="$IN_ADDRESS")
          if [ -n "$IN_ROUND" ]; then args+=(--round="$IN_ROUND"); fi
          if [ "$IN_TEST_MODE" = "true" ]; then args+=(--test-mode); fi
          if [ "$IN_FUND" = "true" ]; then args+=(--fund); fi
          if [ "$IN_RESET" = "true" ]; then args+=(--reset); fi
          if [ "$IN_EXECUTE" = "true" ]; then args+=(--execute); fi
          pnpm exec tsx scripts/data/award-test-setup.ts "${args[@]}"
