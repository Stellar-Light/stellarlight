name: Curate projects (manual)
# workflow-health: signal-steps: ^Idempotence$
on:
  workflow_dispatch:
    inputs:
      execute: { description: "Write? Leave false for a dry run.", type: boolean, default: false }
  # QUALITY.md P3: the first bounded agent lane runs WITHOUT a human pressing
  # the button. Scheduled runs always execute (mirroring enrich-repos) — the
  # pass is evidence-only by construction (curated maps + the operator-toml
  # chain, full-chain-or-abstain), every write is read back, and the census
  # artifacts record the movement for review. Auto-merge stays closed; this
  # is data curation within the lane's bounds, not code.
  schedule:
    - cron: "30 7 * * 2" # weekly, Tuesday 07:30 UTC
permissions: { contents: read }
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Targeted, owner-reviewed project-record edits (DESCRIPTION_FIXES in the
      # script). Dry-run by default; only the listed slugs are touched.
      - run: pnpm exec tsx scripts/data/curate-projects.ts ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
      # sls-079: deployment facts ride the same pass — evidence-derived
      # (mainnet joins, onchain activity, DEPLOYMENT_VERIFIED curation),
      # everything else stays explicitly unknown.
      - run: pnpm exec tsx scripts/data/backfill-deployment.ts ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
      # Idempotence gate (2026-09-06): an execute must leave nothing planned.
      # A write still planned right after it was applied is a lane fight (two
      # maps, or this lane and enrich-scf, on one field) or a writer that does
      # not read back — the class that flipped tucambio, coala-pay, aquarius
      # and six linkage rows on every run for weeks. The writes above already
      # landed; this step only reports, loudly.
      - name: Idempotence
        if: ${{ github.event_name == 'schedule' || inputs.execute }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/data/curate-projects.ts 2>&1 | tee replan.log || true
          n=$(grep -oE '^[0-9]+ write\(s\) planned' replan.log | grep -oE '^[0-9]+' || echo unknown)
          if [ "$n" != "0" ]; then
            echo "::error::$n write(s) still planned after execute — a lane fight or a non-idempotent writer; see the plan above"
            exit 1
          fi
          echo "0 writes planned after execute — every map is in sync"
