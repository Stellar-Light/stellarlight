name: Sync Stellar Scout skill to distribution repo

# Mirrors public/skills/stellar-scout.md to github.com/Stellar-Light/
# stellar-scout on every push to main that touches the file. The
# distribution repo is what `npx skills add Stellar-Light/stellar-scout`
# clones, so without this sync the published skill silently drifts from
# the version this repo serves on stellarlight.xyz/scout.
#
# Auth: a repo-scoped DEPLOY KEY on Stellar-Light/stellar-scout (write),
# private half in this repo's secret STELLAR_LIGHT_SCOUT_DEPLOY_KEY. Chosen
# over a fine-grained PAT after two mints landed with the wrong resource owner
# (a token owned by a person cannot write to an org repo, and the org PAT
# policy adds an approval step). A deploy key is bound to exactly one repo,
# has no expiry, involves no org policy, and no human ever holds it — it was
# generated in CI-adjacent scratch and destroyed after registration.
#
# Rotate: `ssh-keygen -t ed25519 -N "" -f k`; add k.pub as a write deploy key
# on stellar-scout (repo → Settings → Deploy keys); `gh secret set
# STELLAR_LIGHT_SCOUT_DEPLOY_KEY -R Stellar-Light/stellarlight < k`; shred k.
# Trigger manually via `gh workflow run sync-scout-skill.yml` to test.
#
# The workflow is a no-op when the SKILL.md content is byte-identical to
# what's already in Stellar-Light/stellar-scout — `git diff --quiet` skips
# the commit. Safe to run on every push without spamming the history.

on:
  push:
    branches: [main]
    paths:
      - "public/skills/stellar-scout.md"
      - "public/skills/references/**"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stellarlight-main
        uses: actions/checkout@v4

      - name: Push SKILL.md to Stellar-Light/stellar-scout
        id: sync
        continue-on-error: true
        env:
          DEPLOY_KEY: ${{ secrets.STELLAR_LIGHT_SCOUT_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Whole body runs in a subshell piped to tee so the rolling issue
          # gets the log whether we fail on the key check or the push.
          (
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::STELLAR_LIGHT_SCOUT_DEPLOY_KEY secret is missing."
            echo "See the rotate note at the top of this workflow."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/scout_deploy_key
          chmod 600 ~/.ssh/scout_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/scout_deploy_key -o IdentitiesOnly=yes"

          git clone --depth 1 git@github.com:Stellar-Light/stellar-scout.git out

          cp public/skills/stellar-scout.md out/SKILL.md
          mkdir -p out/references && cp public/skills/references/*.md out/references/

          cd out
          git config user.name "stellarlight-bot"
          git config user.email "bot@stellarlight.xyz"

          if git diff --quiet; then
            echo "SKILL.md is already in sync — nothing to push."
            exit 0
          fi

          # Stage BOTH targets. This used to be `git add SKILL.md` alone, so
          # references/api-reference.md — the file Raven pins for sk-018 —
          # could never have synced even with a token.
          git add SKILL.md references
          # Commit message kept to one line — multi-line strings inside a
          # YAML literal block are fragile (a blank line at lower indent
          # ends the block). The commit SHA + workflow trigger live in the
          # auto-generated GitHub Actions log, so we don't lose context.
          git commit -m "sync: SKILL.md from stellarlight@${{ github.sha }} (${{ github.event_name }})"
          git push
          ) 2>&1 | tee sync.log

      # A silent red here means the skill Raven pins goes stale for weeks
      # (it did: every run from 2026-07-20 to 2026-08-18 failed on the
      # missing token and nobody saw it). Same rolling issue every guard uses.
      - name: Track the signal (rolling issue)
        if: always()
        uses: ./.github/actions/rolling-issue
        with:
          title-prefix: "Scout skill sync red"
          outcome: ${{ steps.sync.outcome }}
          body-file: sync.log
      - name: Propagate the red
        if: steps.sync.outcome == 'failure'
        run: exit 1
