name: Scan repo code (signals-only)

# Persists Code-Truth signals (stellarProof, codeDepth, farmScore, scan state)
# onto existing repo docs. Signals-only v1: NO tier / unverifiedStellar /
# repoScore writes (zero demotion risk by construction — write-shape.ts).
# Scores move when enrich-repos next runs. Run dry first, inspect the wave
# report (incl. predicted score lifts), then execute. Re-run for more waves —
# up-to-date scanned repos are skipped (stale ones re-scan), budget guard
# stops before the token runs dry.

on:
  schedule:
    # daily 03:00 UTC — unified wave (re-scan policy 2026-08-08): never-scanned
    # AND pushed-since-scan repos compete on the same -repoScore key, so a
    # changed canonical SDK re-scans before a never-scanned hackathon repo.
    # Subsumes the old weekly Mon stale-first run (which ranked by recency and
    # let hot small repos starve changed SDKs — the 34/48 stale gap). Writes
    # are signals-only (write-shape.ts, zero-demotion by construction).
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false
      limit:
        description: "Max repos this wave"
        type: string
        default: "60"
      lang:
        description: "primaryLanguage filter (e.g. Rust) or 'all'"
        type: string
        default: "Rust"
      verify:
        description: "Read-back mode: print persisted signals for scanned repos (no GitHub calls, no writes)"
        type: boolean
        default: false
      extra:
        description: "Extra flags, e.g. '--rescan --budget 150' (corrective re-scan sized to a partial token window)"
        type: string
        default: ""

permissions: { contents: read }

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Account-wide PAT (5,000/hr, read-only public fetches) — the built-in
      # Actions token capped waves at ~60 repos, putting the 1,342-repo
      # backlog 22 days out (2026-07-19 converge plan). Falls back to the
      # Actions token when the secret is absent.
      GITHUB_TOKEN: ${{ secrets.STELLAR_LIGHT_SCOUT_MCP_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # inputs.* are EMPTY on schedule events (2026-07-08 review, finding 18 —
      # the "weekly stale-first" run was a write-nothing dry run of the wrong
      # wave). Scheduled runs get their own hardcoded step.
      - name: Daily backlog wave (schedule)
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
        # --lang all (2026-07-11): the default is Rust-only, which structurally
        # excluded every JS/TS repo from the daily wave — js-stellar-sdk never
        # got real symbols, so symbol lookups failed for the main SDK.
        run: pnpm exec tsx scripts/scan/scan-repo-code.ts --execute --limit 60 --lang all
      - name: Manual wave (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx scripts/scan/scan-repo-code.ts --limit ${{ inputs.limit }} --lang ${{ inputs.lang }} ${{ inputs.execute && '--execute' || '' }} ${{ inputs.verify && '--verify' || '' }} ${{ inputs.extra }}
