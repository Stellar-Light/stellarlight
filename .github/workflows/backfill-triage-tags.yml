name: Backfill triage tags

# Full-corpus triage tagging from STORED signals (zero GitHub API calls —
# safe to run any time without touching the scan budget). Covers the
# EC-taxonomy rows the project-scoped enrich loop never reaches. Dry-run
# default; inspect the tag distribution, then execute.

on:
  schedule:
    # nightly 04:00 UTC — AFTER the 03:00 scan wave and enrich, so derivation
    # reads the freshest stored signals. This is the STANDING corpus-wide
    # tagging cadence: enrich-repos only walks project-linked rows, so the
    # EC long tail re-derives (and self-heals: revived repos untag) here.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false

concurrency:
  group: backfill-triage-tags
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # inputs.* are EMPTY on schedule events (scan-repo-code finding 18) —
      # the nightly gets its own hardcoded execute step.
      - name: Nightly backfill (schedule)
        if: github.event_name == 'schedule'
        run: pnpm exec tsx scripts/backfill-triage-tags.ts --execute
      - name: Manual backfill (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx scripts/backfill-triage-tags.ts ${{ inputs.execute && '--execute' || '' }}
