name: Scan repo code (signals-only)

# Persists Code-Truth signals (stellarProof, codeDepth, farmScore, scan state)
# onto existing repo docs. Signals-only v1: NO tier / unverifiedStellar /
# repoScore writes (zero demotion risk by construction — write-shape.ts).
# Scores move when enrich-repos next runs. Run dry first, inspect the wave
# report (incl. predicted score lifts), then execute. Re-run for more waves —
# up-to-date scanned repos are skipped (stale ones re-scan), budget guard
# stops before the token runs dry.

on:
  schedule:
    # every 2h — backlog-convergence cadence (2026-08-15): the EC census left
    # ~10.7k eligible repos; one daily wave puts convergence months out. Each
    # wave drinks the PAT pool to the in-script budget floor and the next wave
    # resumes (BUDGET-STOPPED + resume offsets), so a 2h cadence self-throttles
    # against the shared 5,000/hr PAT. Triage-skip (#897) keeps waves off dead
    # repos. Unified re-scan policy 2026-08-08: never-scanned AND pushed-since-
    # scan compete on the same -repoScore key. Revert to daily 03:00 once the
    # backlog converges (scanned ≈ eligible).
    # :17, not :00 (2026-09-02): top-of-hour is GitHub's most congested
    # schedule minute and this cron was the casualty — the 14:00Z slot ran at
    # 14:31Z, 18:00Z at 19:12Z, 22:00Z at 22:23Z, and the 00:00Z and 02:00Z
    # slots had not started 9 minutes past while an hourly canary at :31 kept
    # firing. GitHub documents that scheduled runs are delayed or dropped
    # under load; an off-peak minute is the only lever we hold.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false
      limit:
        description: "Max repos this wave"
        type: string
        default: "60"
      lang:
        description: "primaryLanguage filter (e.g. Rust) or 'all'"
        type: string
        default: "Rust"
      verify:
        description: "Read-back mode: print persisted signals for scanned repos (no GitHub calls, no writes)"
        type: boolean
        default: false
      extra:
        description: "Extra flags, e.g. '--rescan --budget 150' (corrective re-scan sized to a partial token window)"
        type: string
        default: ""

# 2026-08-11: four rapid --only scans auto-fired four CONCURRENT full-corpus
# chase enriches — PAT starvation + same-row write races (read-back caught 230
# fields not persisting as sent). One group serializes runs AND collapses
# queued duplicates: GitHub keeps at most one running + one pending per group,
# so N chases debounce to 2 — the last full pass covers all prior scans.
concurrency:
  group: scan-repo-code
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Account-wide PAT (5,000/hr, read-only public fetches) — the built-in
      # Actions token capped waves at ~60 repos, putting the 1,342-repo
      # backlog 22 days out (2026-07-19 converge plan). Falls back to the
      # Actions token when the secret is absent.
      GITHUB_TOKEN: ${{ secrets.STELLAR_LIGHT_SCOUT_MCP_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # inputs.* are EMPTY on schedule events (2026-07-08 review, finding 18 —
      # the "weekly stale-first" run was a write-nothing dry run of the wrong
      # wave). Scheduled runs get their own hardcoded step.
      - name: Backlog wave (schedule)
        if: github.event_name == 'schedule'
        # --lang all (2026-07-11): the default is Rust-only, which structurally
        # excluded every JS/TS repo from the daily wave — js-stellar-sdk never
        # got real symbols, so symbol lookups failed for the main SDK.
        # --limit 500 (2026-08-14): 60 was sized for the pre-PAT 1,000/hr
        # Actions token and never raised after the 5,000/hr PAT landed. The
        # limit is deliberately ABOVE one hour's budget — the in-script
        # budget guard (BUDGET-STOPPED, resume next wave) is the governor;
        # every wave simply drinks the pool dry and the next wave resumes.
        run: pnpm exec tsx scripts/scan/scan-repo-code.ts --execute --limit 500 --lang all
      - name: Manual wave (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: pnpm exec tsx scripts/scan/scan-repo-code.ts --limit ${{ inputs.limit }} --lang ${{ inputs.lang }} ${{ inputs.execute && '--execute' || '' }} ${{ inputs.verify && '--verify' || '' }} ${{ inputs.extra }}
