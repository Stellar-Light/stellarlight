# Engine A — the generated recall matrix (weekly). Derives probes from the
# live data itself (every record's fields imply its queries) and scores
# recall per bucket. Red = a bucket fell below its floor; the rolling-issue
# step files/updates one tracked issue and closes it again on green.
#
# A red at this step is the detector reporting a finding, not the lane
# breaking (read by scripts/check-workflow-health.ts):
# workflow-health: signal-steps: ^Propagate the red$
name: generated-recall
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch: {}
concurrency:
  group: generated-recall
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No version, and package.json has no packageManager field for it to
      # read — the action exits before installing anything. Every other lane
      # pins the major here.
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Engine A
        id: engine
        continue-on-error: true
        # shell: bash = pipefail; GitHub's default bash -e has none, so `| tee`
        # masked this step's exit code (2026-08-12 lesson).
        shell: bash
        run: pnpm exec tsx scripts/eval/generated-recall.ts | tee engine-a.log $GITHUB_STEP_SUMMARY

      # The engine wrote its artifact and nothing carried the number across, so
      # /quality reported the north star "measured 10 days ago" while this lane
      # had run the day before. Appending here keeps the headline tracking the
      # engine instead of a hand-edited file. Idempotent: it appends only when
      # the artifact is newer than the last point.
      - name: Append to the north-star series
        run: pnpm exec tsx scripts/quality/append-north-star.ts --execute

      # Without this the append lives and dies inside the runner, which is the
      # same "nothing consumed it" defect one layer down.
      - name: Commit the series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add improvements/audits/north-star-series.json || true
          git diff --cached --quiet || git commit -m "data(quality): north-star point from Engine A [skip ci]"
          git diff --quiet HEAD origin/main -- improvements/audits/north-star-series.json 2>/dev/null || {
            git pull --rebase origin main && git push
          }
      - name: Track the signal (rolling issue)
        uses: ./.github/actions/rolling-issue
        with:
          title-prefix: "Engine A (generated recall) red"
          outcome: ${{ steps.engine.outcome }}
          body-file: engine-a.log
      - name: Propagate the red
        if: steps.engine.outcome == 'failure'
        run: exit 1
