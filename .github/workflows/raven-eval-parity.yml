# Guard C — do our graded answers survive the trip through Raven?
#
# The 53 golden questions are asked against stellarlight.xyz directly. Agents
# never reach us that way. The gap is not hypothetical: searchProjects with
# type=Exchange returns 0 through Raven and 14 over HTTP, because Raven
# validates against a stale copy of our enum — correct for us, broken for every
# agent, invisible to the existing eval.
#
# Also runs the two absence/consistency guards, so one job covers the class.
#
# GATING: a scheduled run has no `inputs`, so `inputs.gate` was empty and the
# daily run passed `--gate` to nothing — all three guards printed findings and
# exited 0. A detector that cannot go red is indistinguishable from a green one.
# Scheduled runs now always gate. This adds no new flakiness class: a transient
# Raven/network failure already exits 1 inside every guard ("an unrun probe is a
# failure, gate or not"), so the only thing newly failing the build is a real
# finding about OUR data.
name: raven-eval-parity

on:
  schedule:
    - cron: "30 7 * * *" # daily, after the nightly data jobs
  workflow_dispatch:
    inputs:
      gate:
        description: "Exit red on any regression. Scheduled runs ALWAYS gate."
        required: false
        type: boolean
        default: true

permissions: { contents: read }

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Bank hygiene BEFORE the guards: authoring defects + live bank rot
      # (an expected slug that no longer resolves to itself). A rotted bank
      # fails here as BANK-LINT, never disguised as a service regression.
      - name: Bank lint (structure + live rot)
        run: pnpm exec tsx scripts/eval/lint-eval-banks.ts --live

      - name: Golden questions — direct vs through Raven
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-golden-parity.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}

      - name: Cross-surface consistency (guard A)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-surface-consistency.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}

      - name: Honest absence (guard B)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-honest-absence.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}

      - name: Truth battery (guard D — rotating probes, curated answer key)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-truth-battery.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}
