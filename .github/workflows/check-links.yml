name: Curator Agent — Link health check

# Daily cron that HEAD-requests every external URL in the directory and
# records the result in the LinkChecks Payload collection. Admin dashboard
# at /admin/collections/link-checks surfaces broken / redirecting URLs.
#
# Why daily, not weekly:
#   - Stellar projects ship + sunset constantly; weekly is too coarse to
#     keep Scout's citations honest
#   - HEAD requests are cheap (~1 KB per URL × ~200 URLs = ~200 KB/day,
#     zero cost)
#   - The dashboard's "consecutiveFailures" counter is most useful when
#     it ticks day-by-day so admins can spot a transient blip vs a true
#     deletion
#
# Cadence offset from neighbours:
#   - 02:00 UTC link health   ← this one
#   - 06:00 UTC EC snapshot   (refresh-ec-snapshot.yml)
#   - 06:00 UTC research      (refresh-research-corpus.yml)
#   So we don't pile three jobs on the runner at the same minute.

on:
  schedule:
    # Daily again (2026-09-01). It went weekly on 2026-07-16 because ~18
    # min/run burned ~540 Actions-min/month of the PRIVATE-repo free tier.
    # The repo is public now (Actions minutes are free on public repos) and a
    # full run took 7 min today. Weekly also starved the status-basis lane:
    # a relink or a checker fix only earns a row its evidence when this
    # runs, and consecutiveFailures is only meaningful when it ticks daily
    # (the header's original reasoning). The checker is HEAD-first and reads
    # at most 64 KB per URL.
    # :23, not :00 (2026-09-02): the first daily slot at 02:00Z never fired —
    # top-of-hour is GitHub's most congested schedule minute (the scan cron
    # lost its 00:00Z and 02:00Z slots the same night). Off-peak minutes are
    # the only lever we hold.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, scan + report but don't write to DB. Default false."
        required: false
        default: "false"

permissions:
  contents: write

env:
  DATABASE_URI: ${{ secrets.DATABASE_URI }}
  PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

# Review finding 15: no concurrency group meant a manual dispatch during the
# (long) scheduled run raced two --execute processes on the unique url index.
concurrency:
  group: check-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Review finding 8: 15 min was sized for the "~200 URLs" comment above; the
    # run now checks 2,106 URLs (10s ceiling each, concurrency 5) + ~4,200
    # sequential DB round-trips AFTER the checks — a kill mid-write corrupts
    # the freshness counters. Sized for worst case.
    timeout-minutes: 25 # run is ~18 min; cap runaway cost (was 60)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run link health check
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm exec tsx scripts/check-links.ts
          else
            pnpm exec tsx scripts/check-links.ts --execute
          fi

      # The proven-broken list is a work queue, so it lands where the
      # improvement ledger reads it. Runs even if the check step failed — a
      # partial list is still true about what it did probe.
      - name: Commit the artifact if it changed
        if: always()
        run: |
          set -euo pipefail
          git config user.name "stellarlight-bot"
          git config user.email "bot@stellarlight.xyz"
          git add improvements/audits/link-health-latest.json || exit 0
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data(quality): link health [skip ci]"
          git pull --rebase origin main
          git push
