name: Curated hackathon builds

# Stores the submissions of hackathons off DoraHacks (src/data/curated-builds.ts,
# HackMeridian first) as hackathon builds, so search, prior art, briefs and
# event pages serve them. The one writer of `curated-` rows; the DoraHacks
# sync never touches them. Upserts, never deletes; a row that does not read
# back fails the run. Dispatch only: a dry run unless execute=true.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Write the rows? Leave false for a dry run."
        type: boolean
        default: false

concurrency:
  group: curated-builds
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/import-curated-builds.ts ${{ inputs.execute && '--execute' || '' }}
