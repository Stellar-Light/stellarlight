name: Build source locators

# Rebuilds the source-locator index that locateSource (/api/sources/locate)
# serves: pointers (repo, commit, path, symbol or heading, line, git blob
# sha) into nine allowlisted repos (Stellar's own and OpenZeppelin's Soroban
# contract library), read from one public tarball per repo at its
# default-branch HEAD. Never a file body.
#
# Writes only new, gone or changed-blob pointers, then reads every written
# row back; the Idempotence step rebuilds at the stored commits and must plan
# 0 writes. Manual dispatch is a dry run unless execute=true. The schedule
# writes a repo only once that repo has been filled by a hand-dispatched
# execute whose dry run was read first; a repo not filled yet stays dry.
# A tarball with no indexable file, or a plan deleting more than max(50,
# half) of a repo's pointers, writes nothing and turns the job red; the
# second needs allow_shrink=true on an execute dispatch, best scoped with
# repo= to the one repo whose plan was read. A dry dispatch never forwards
# allow_shrink, so its plan always shows what would be refused.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false
      allow_shrink:
        description: "Let a plan delete more than max(50, half) of a repo's pointers. Execute only, after reading that plan."
        type: boolean
        default: false
      repo:
        description: "Only this repo (owner/name, e.g. stellar/quickstart). Empty = all nine."
        type: string
        default: ""
  schedule:
    - cron: "17 5 * * *" # daily; :17 because crons at :00 get dropped under load

concurrency:
  group: build-source-locators
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # One HEAD lookup per repo through the API; tarballs come from codeload.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Inputs reach the scripts through env, never inline: a repo value is
      # one argument, not shell. The schedule never passes --allow-shrink or
      # --repo.
      - name: Build the index
        env:
          EVENT: ${{ github.event_name }}
          EXECUTE: ${{ inputs.execute }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          REPO: ${{ inputs.repo }}
        run: |
          args=()
          if [ "$EVENT" = schedule ]; then
            args+=(--execute --scheduled)
          else
            if [ "$EXECUTE" = true ]; then
              args+=(--execute)
              if [ "$ALLOW_SHRINK" = true ]; then args+=(--allow-shrink); fi
            fi
            if [ -n "$REPO" ]; then args+=(--repo "$REPO"); fi
          fi
          pnpm exec tsx scripts/build-source-locators.ts "${args[@]}"
      - name: Idempotence
        if: github.event_name == 'schedule' || inputs.execute
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ inputs.repo }}
        run: |
          args=(--replan)
          if [ "$EVENT" != schedule ] && [ -n "$REPO" ]; then args+=(--repo "$REPO"); fi
          pnpm exec tsx scripts/build-source-locators.ts "${args[@]}"
