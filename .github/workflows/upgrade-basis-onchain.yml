name: Upgrade status basis from on-chain evidence (manual)
# P4 basis lane: weak-basis Live rows whose OWN row already serves dated
# on-chain evidence (asset movement deltas, verified DeFiLlama TVL) upgrade to
# statusBasis=onchain-activity. Dry-run by default; execute=true writes.
# Never changes status; never touches strong bases; refuses stale evidence.
on:
  workflow_dispatch:
    inputs:
      execute: { description: "Write to DB? Leave false for a dry run.", type: boolean, default: false }
permissions: { contents: read }
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/data/upgrade-basis-onchain.ts ${{ inputs.execute && '--execute' || '' }}
