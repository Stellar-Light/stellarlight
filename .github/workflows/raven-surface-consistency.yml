# Guard A — do two of our answers to the SAME question agree, as an AGENT sees
# them through Raven?
#
# sls-073 got past ~30 guards because every one asks "is this field present and
# well-formed?" and none asks "is this answer consistent with our other
# answer?". An SDF reviewer found it instead of us. This closes that class.
#
# Report-only by default; --gate to fail the run.
name: raven-surface-consistency

on:
  schedule:
    # Daily, an hour after the nightly data jobs settle.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      gate:
        description: "Exit red when surfaces disagree."
        required: false
        type: boolean
        default: false

permissions: { contents: read }

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Ask Raven the same question two ways
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-surface-consistency.ts ${{ inputs.gate && '--gate' || '' }}
