name: Secret scan

# gitleaks over the commits a change adds, on every PR and push to main; a
# manual run scans the whole history once. The repo is public and Actions
# logs are world-readable, so findings print redacted: rule, file, line and
# commit, never the secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Scan the whole history (false scans the latest commit only)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The expected hash is pinned here (from the release's checksums file,
      # 2026-10-21), so a replaced release asset fails instead of verifying.
      - name: Install gitleaks 8.30.1, checksum verified
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; then
            range=""
          elif [ "$EVENT" = "pull_request" ]; then
            range="--log-opts=$BASE..$HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
            && [ "$(git rev-list --count "$BEFORE..$AFTER" 2>/dev/null || echo 0)" -gt 0 ]; then
            range="--log-opts=$BEFORE..$AFTER"
          elif [ "$EVENT" = "push" ]; then
            # First push, or a force push that rewound: the range is empty.
            echo "::notice::push range empty or rewritten; scanning the latest 20 commits"
            range="--log-opts=-20"
          else
            range="--log-opts=-1"
          fi
          gitleaks git --redact=100 --no-banner --verbose $range .
