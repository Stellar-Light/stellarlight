name: Secret scan

# gitleaks over the commits a change adds, on every PR and push to main; a
# manual run scans the whole history once. The repo is public and Actions
# logs are world-readable, so findings print redacted: rule, file, line and
# commit, never the secret.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Scan the whole history instead of the latest commits."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1, checksum verified
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            | grep '  gitleaks_8.30.1_linux_x64.tar.gz$' \
            | sed "s#  gitleaks_8.30.1_linux_x64.tar.gz#  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz#" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FULL" = "true" ]; then
            range=""
          elif [ "$EVENT" = "pull_request" ]; then
            range="--log-opts=$BASE..$HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="--log-opts=$BEFORE..$AFTER"
          else
            range="--log-opts=-1"
          fi
          gitleaks git --redact --no-banner --verbose $range .
