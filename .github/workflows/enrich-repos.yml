name: Enrich repos (code-reference index)
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Write? Leave false for a dry run, which also records no redirect findings."
        type: boolean
        default: false
      only:
        description: "Pin to one repo (owner/repo) — targeted re-enrich"
        type: string
        default: ""
      unlink:
        description: "With execute: also unlink repos no project claims. Read a dry run's unlink lines first."
        type: boolean
        default: false
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday 08:00 UTC
  # Chase DISPATCHED scan waves automatically: repoGrade only ingests
  # persisted codeDepth when enrich runs, so a big backlog burst otherwise
  # sat up to a week before moving any ranking (2026-07-19 converge plan).
  # Scheduled daily scans do NOT trigger this — only deliberate manual waves.
  workflow_run:
    workflows: ["Scan repo code (signals-only)"]
    types: [completed]
# 2026-08-11: four rapid --only scans auto-fired four CONCURRENT full-corpus
# chase enriches — PAT starvation + same-row write races (read-back caught 230
# fields not persisting as sent). One group serializes runs AND collapses
# queued duplicates: GitHub keeps at most one running + one pending per group,
# so N chases debounce to 2 — the last full pass covers all prior scans.
concurrency:
  group: enrich-repos
  cancel-in-progress: false
# Read-only for the job that installs dependencies, reads third-party repo
# data and holds DATABASE_URI. Only record-redirects, which installs and runs
# nothing from the repo, may push.
permissions: { contents: read }
jobs:
  enrich:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      redirects: ${{ steps.redirects.outputs.wrote }}
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Built-in token reads public-repo metadata (topics/stars/lastCommit) fine.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Scheduled runs ALWAYS execute (the whole point of the weekly refresh);
      # manual dispatch stays dry-run unless the execute box is ticked.
      # Unlinking repos no project claims needs both boxes on a manual
      # dispatch: scheduled and chained runs only print the unlink plan.
      # An executed full run writes its redirect findings to the runner's
      # temp directory (src/lib/repo-takeover.ts), never into the checkout.
      # The only input reaches the script through env, never as script text.
      - env:
          REPO_REDIRECTS_ARTIFACT: ${{ runner.temp }}/repo-redirects-latest.json
          ONLY: ${{ inputs.only }}
        run: pnpm exec tsx scripts/enrich-repos.ts ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.execute) && '--execute' || '' }} ${ONLY:+--only "$ONLY"} ${{ github.event_name == 'workflow_dispatch' && inputs.execute && inputs.unlink && '--unlink' || '' }}
      # The writer guards its own class: a lookup/write key mismatch in the
      # pass above creates one duplicate row per run and nothing else
      # red-lines (the 2026-08-28 census found 381 copies this way). Runs
      # even when the enrich step failed — a partial wave can still have
      # written duplicates, and blind is not green.
      - name: Guard — one row per repo
        if: always()
        run: pnpm exec tsx scripts/data/check-repo-dupes.ts
      # Handed to record-redirects. Only an executed full run writes the
      # file, so a dry or targeted run hands nothing on.
      - name: Keep the redirect findings
        id: redirects
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/repo-redirects-latest.json" ]; then
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          fi
      - if: always() && steps.redirects.outputs.wrote == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: repo-redirects
          path: ${{ runner.temp }}/repo-redirects-latest.json
          retention-days: 14
          # A re-run attempt uploads under the same name.
          overwrite: true
  # Commits the one file enrich left, for the improvement ledger. The only job
  # with a write token, and it installs and runs nothing from the repo. Only
  # a run on main records: a dispatch on another branch never pushes.
  # always(): a run that failed after its loop still carries what it found.
  record-redirects:
    needs: enrich
    if: always() && github.ref == 'refs/heads/main' && needs.enrich.outputs.redirects == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repo-redirects
          path: improvements/audits
      - name: Commit the redirect findings
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add improvements/audits/repo-redirects-latest.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(quality): repo redirect findings [skip ci]"
          # Push first; on a rejection keep THIS run's file (-X theirs is the
          # commit being replayed) and stash anything else (check-links.yml).
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash -X theirs origin main || git rebase --abort
          done
          git push
