name: Jev page verdicts (manual)
# Read-only: measures Jev (TypeSafe AI's typed-decision model, through Vercel
# AI Gateway) against pages a human already judged, or lists weak-basis Live
# rows whose site Jev reads as not the product. Public API + public pages +
# the gateway; no database secrets and no writes. Needs AI_GATEWAY_API_KEY;
# without it the run measures the regex baseline only and says so.
on:
  workflow_dispatch:
    inputs:
      mode: { description: "eval (labeled pages) or review (weak-basis Live rows)", type: choice, options: [eval, review], default: eval }
      bar: { description: "Confidence a Jev answer must clear to count", type: string, default: "0.9" }
permissions: { contents: read }
jobs:
  verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - env:
          MODE: ${{ inputs.mode }}
          BAR: ${{ inputs.bar }}
        run: pnpm exec tsx scripts/eval/jev-page-verdict.ts $([ "$MODE" = review ] && echo --review) --bar "$BAR" --out jev-page-verdicts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jev-page-verdicts, path: jev-page-verdicts.json, if-no-files-found: ignore }
