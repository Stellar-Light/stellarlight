# Drift guard — asserts the live API, the OpenAPI spec, and the skill docs
# still agree. Created after a downstream consumer (2026-06-20) found the three
# had silently diverged as endpoints/params were added. Runs daily + on demand.
#
# A red at this step is the drift detector reporting a finding, not the lane
# breaking. This lane runs WITHOUT an install — every script it calls reaches
# the live API with fetch and nothing else. A step needing a package belongs in
# nightly-health, which installs: the RWA issuer reconcile sat here from
# 2026-09-09 and failed ERR_MODULE_NOT_FOUND on @stellar/stellar-sdk on every
# single run, reddening a lane whose own checks were all green. All three
# detectors continue on error and red the lane at one declared step, after the
# rolling issue has recorded them (read by scripts/check-workflow-health.ts):
# workflow-health: signal-steps: ^Propagate the red$
name: API drift guard

on:
  schedule:
    - cron: "17 13 * * *" # daily ~13:17 UTC
  workflow_dispatch:
    inputs:
      base:
        description: "Base URL to check"
        required: false
        default: "https://stellarlight.xyz"

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    # Every detector reads SCOUT_BASE. Only the drift step used to get it (found
    # 2026-10-15), so a dispatch against another base checked drift there and
    # field-population and skill-reference against production.
    env:
      SCOUT_BASE: ${{ github.event.inputs.base || 'https://stellarlight.xyz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run API drift guard
        id: drift
        continue-on-error: true
        # shell: bash = pipefail; GitHub's default bash -e has none, so `| tee`
        # masked this step's exit code (2026-08-12 lesson).
        shell: bash
        run: npx -y tsx scripts/check-api-drift.ts 2>&1 | tee drift.log
      - name: Field-population guard (values arrive, not just shape)
        id: fields
        if: always()
        continue-on-error: true
        shell: bash
        run: npx -y tsx scripts/check-field-population.ts 2>&1 | tee fields.log
      - name: Skill-reference coverage (sk-009 — served skill must not lag the contract)
        id: skillref
        if: always()
        continue-on-error: true
        shell: bash
        run: npx -y tsx scripts/check-skill-reference.ts 2>&1 | tee skillref.log
      # One verdict for all three detectors. Track used to read the drift step
      # alone and, with no always(), was skipped whenever field-population or
      # skill-reference failed: nine red runs from 2026-10-06 to 10-14 opened no
      # issue, the drift guard's own 3 failures included. Anything short of
      # three greens is red here, so a skipped or cancelled detector can never
      # close the issue as green.
      - name: Collect the red
        id: red
        if: always()
        shell: bash
        env:
          OUTCOMES: drift=${{ steps.drift.outcome }} fields=${{ steps.fields.outcome }} skillref=${{ steps.skillref.outcome }}
        run: |
          : > red.log
          for pair in $OUTCOMES; do
            name=${pair%=*} outcome=${pair#*=}
            if [ "$outcome" != success ]; then
              { echo "=== $name: $outcome"; cat "$name.log" 2>/dev/null || true; echo; } >> red.log
            fi
          done
          echo "outcome=$([ -s red.log ] && echo failure || echo success)" >> "$GITHUB_OUTPUT"
      # The rolling issue tracks production. A dispatch against any other base
      # still reds the run below, but must not open or close that issue.
      - name: Track the signal (rolling issue)
        if: always() && env.SCOUT_BASE == 'https://stellarlight.xyz'
        uses: ./.github/actions/rolling-issue
        with:
          title-prefix: "API drift guard red"
          outcome: ${{ steps.red.outputs.outcome }}
          body-file: red.log
      - name: Propagate the red
        if: steps.red.outputs.outcome == 'failure'
        run: exit 1
