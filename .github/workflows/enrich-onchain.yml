# On-chain readings (2026-07-20): populates projects.onchain (per contract
# the newest event, ledgers with an event, TTL state and attested source repo;
# per asset holders, supply, trustlines and newest movement) from Stellar
# Index, Horizon and the Soroban RPC, join keys hand-verified in
# src/data/onchain-contracts.ts and the curated on-chain map
# (src/data/onchain-map.json: contracts and accounts, each checked weekly for
# existence on mainnet and marked endedAt when read absent). The explorer it
# read until 2026-11-03 went paid and the lane failed for three weeks.
# Weekly + dispatchable; dry-run by default on dispatch.
name: Enrich on-chain metrics
on:
  schedule:
    - cron: "0 6 * * 2" # weekly, Tue 06:00 UTC
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually write (default = dry run)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  enrich:
    runs-on: ubuntu-latest
    # About 5 minutes for 68 contracts (2026-11-22); the map adds about 300
    # contracts and 356 Horizon account reads.
    timeout-minutes: 40
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # GitHub's build attestations are read for each contract's WASM
      # (public repos); a token keeps the read off the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Enrich (scheduled runs execute; dispatch honors the input)
        run: pnpm exec tsx scripts/data/enrich-onchain-projects.ts ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
