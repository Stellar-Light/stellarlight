name: Refresh paid-endpoint index (private)

# The agent-payments index. It is NOT part of the public API: the collection
# is admin-read only and has no OpenAPI operation, so Raven cannot discover
# or call it. This job only fills it.
#
# Daily because liveness is the whole point — agent endpoints are demos far
# more often than products, so an index that is never re-probed becomes a
# list of dead links within a quarter. ~210 plain HTTP requests against the
# endpoints themselves; no rate-limited API, so it never competes with the
# shared GitHub PAT budget the enrich jobs use.

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually write. Unchecked = dry run."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Probe
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.execute }}" = "true" ]; then
            pnpm exec tsx scripts/refresh-paid-endpoints.ts --execute
          else
            pnpm exec tsx scripts/refresh-paid-endpoints.ts
          fi
