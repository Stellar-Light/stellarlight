name: Jev evals (manual)
# Read-only: measures Jev (TypeSafe AI's typed-decision model, through Vercel
# AI Gateway) against human labels. task=page: what a project's website shows;
# task=types: which project types fit. mode=review lists rows Jev confidently
# disagrees with. Public API + public pages + the gateway; no database secrets
# and no writes. Needs AI_GATEWAY_API_KEY; without it the run says so.
on:
  workflow_dispatch:
    inputs:
      task: { description: "page (what a website shows) or types (which project types fit)", type: choice, options: [page, types], default: page }
      mode: { description: "eval (score against human labels) or review (list confident disagreements)", type: choice, options: [eval, review], default: eval }
      bar: { description: "Confidence a Jev answer must clear to count", type: string, default: "0.9" }
permissions: { contents: read }
jobs:
  verdicts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - env:
          TASK: ${{ inputs.task }}
          MODE: ${{ inputs.mode }}
          BAR: ${{ inputs.bar }}
        run: pnpm exec tsx scripts/eval/jev-eval.ts --task "$TASK" $([ "$MODE" = review ] && echo --review) --bar "$BAR" --out jev-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jev-eval, path: jev-eval.json, if-no-files-found: ignore }
