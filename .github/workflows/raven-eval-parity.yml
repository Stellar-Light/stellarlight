# Guard C — do our graded answers survive the trip through Raven?
#
# The 53 golden questions are asked against stellarlight.xyz directly. Agents
# never reach us that way. The gap is not hypothetical: searchProjects with
# type=Exchange returns 0 through Raven and 14 over HTTP, because Raven
# validates against a stale copy of our enum — correct for us, broken for every
# agent, invisible to the existing eval.
#
# Also runs the two absence/consistency guards, so one job covers the class.
#
# GATING: a scheduled run has no `inputs`, so `inputs.gate` was empty and the
# daily run passed `--gate` to nothing — all three guards printed findings and
# exited 0. A detector that cannot go red is indistinguishable from a green one.
# Scheduled runs now always gate. This adds no new flakiness class: a transient
# Raven/network failure already exits 1 inside every guard ("an unrun probe is a
# failure, gate or not"), so the only thing newly failing the build is a real
# finding about OUR data.
name: raven-eval-parity

on:
  schedule:
    - cron: "30 7 * * *" # daily, after the nightly data jobs
  workflow_dispatch:
    inputs:
      gate:
        description: "Exit red on any regression. Scheduled runs ALWAYS gate."
        required: false
        type: boolean
        default: true

permissions: { contents: write }

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Bank hygiene BEFORE the guards: authoring defects + live bank rot
      # (an expected slug that no longer resolves to itself). A rotted bank
      # fails here as BANK-LINT, never disguised as a service regression.
      - name: Bank lint (structure + live rot)
        run: pnpm exec tsx scripts/eval/lint-eval-banks.ts --live

      - name: Golden questions — direct vs through Raven
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/eval/raven-golden-parity.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }} | tee /tmp/parity.out

      - name: Cross-surface consistency (guard A)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-surface-consistency.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}

      - name: Honest absence (guard B)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        run: pnpm exec tsx scripts/eval/raven-honest-absence.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }}

      - name: Truth battery (guard D — rotating probes, curated answer key)
        if: always()
        env:
          RAVEN_TOKEN: ${{ secrets.RAVEN_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx scripts/eval/raven-truth-battery.ts ${{ (github.event_name == 'schedule' || inputs.gate) && '--gate' || '' }} | tee /tmp/battery.out

      # Record today's snapshot into the committed trend history — ALWAYS,
      # red days included: a trend that only records green days is a lie.
      # Bot data commits do not trigger deploys (the site shows the new point
      # on the next deploy) and the append is idempotent per date.
      # Rebuild the consumer-facing quality artifacts from the freshly-run
      # ledger + live samples. The miss funnel REPLAYS open recall findings,
      # so it is what tells the page (and /api/quality) how much of the open
      # count is stale rather than real debt.
      - name: Rebuild quality artifacts (entities + miss funnel)
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          # Clear findings that no longer reproduce BEFORE measuring, so the
          # open count is real debt rather than last week's fixes waiting for
          # their detector to run again.
          pnpm exec tsx scripts/quality/clear-stale-findings.ts --execute
          pnpm exec tsx scripts/quality/build-quality-artifact.ts
          MISS_SAMPLE=80 pnpm exec tsx scripts/quality/classify-misses.ts
          pnpm exec tsx scripts/quality/build-progress-artifact.ts

      - name: Record quality snapshot (trend history)
        if: always() && github.event_name != 'pull_request'
        run: |
          BP=$(grep -oE '[0-9]+ pass' /tmp/battery.out | grep -oE '[0-9]+' | head -1 || true)
          BF=$(grep -oE '[0-9]+ fail' /tmp/battery.out | grep -oE '[0-9]+' | head -1 || true)
          PP=$(grep -oE '[0-9]+ pass both' /tmp/parity.out 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)
          pnpm exec tsx scripts/quality/record-quality-snapshot.ts \
            ${BP:+--battery-pass $BP} ${BF:+--battery-fail $BF} ${PP:+--parity-pass $PP}
          git config user.name "stellarlight-quality-bot"
          git config user.email "bot@stellarlight.xyz"
          git add improvements/quality/ improvements/ledger/findings.json
          git diff --cached --quiet && exit 0
          git commit -m "data(quality): daily trend snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
