name: Refresh RWA measurements

# The second bounded lane (P3). Measures every verified RWA registry row —
# supply, holders, activity — into the rwa-assets collection every six hours.
# The registry (src/data/rwa-registry.ts) stays the identity source; this is
# what is TRUE about each asset now, dated.
#
# A failed fetch never blanks a good number; a row is never deleted; a run
# that could not measure most of the set exits 2 — neither red nor green.
# Manual dispatch is dry-run unless execute=true; the schedule always writes.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false
  schedule:
    - cron: "37 */6 * * *" # :37 — crons at :00 get dropped under load

concurrency:
  group: refresh-rwa
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Scheduled runs ALWAYS execute (the point of the lane); manual dispatch
      # stays dry-run unless the execute box is ticked.
      - run: pnpm exec tsx scripts/refresh-rwa.ts ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
