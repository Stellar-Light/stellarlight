name: Sync hackathon builds

# Stores every Stellar hackathon submission DoraHacks lists in the
# hackathon-builds collection, reads each submission's own page, links each
# one to the directory project that lists its exact repo, embeds rows whose
# text changed, keeps hackathon_build_vector_index in place, and reads the
# Stellar packages each submission's repo declares (at most 400 repos a run,
# one REST call each). /api/hackathons/builds serves this store first and
# falls back to a live DoraHacks read.
#
# A row is never deleted; a failed read never blanks a stored value; an
# instrument failure (no events, most rosters or pages unreadable) exits 2.
# Manual dispatch is dry-run unless execute=true; the schedule always writes.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Write to the DB? Leave false for a dry run."
        type: boolean
        default: false
  schedule:
    - cron: "43 4 * * *" # daily; :43 because crons at :00 get dropped under load

concurrency:
  group: sync-hackathon-builds
  cancel-in-progress: false
permissions: { contents: read }

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URI: ${{ secrets.DATABASE_URI }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      # Embeddings for search by meaning (voyage-3, same key as embed-projects).
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      # Repo trees for the stack step (public repos; the Actions token, not
      # the shared scan PAT).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Scheduled runs ALWAYS execute (the point of the lane); manual dispatch
      # stays dry-run unless the execute box is ticked.
      - run: pnpm exec tsx scripts/sync-hackathon-builds.ts ${{ (github.event_name == 'schedule' || inputs.execute) && '--execute' || '' }}
